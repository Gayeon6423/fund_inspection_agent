[project]
name = "fund-check"
version = "0.1.0"
description = "Fund script generation and inspection tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.135.3",
  "python-dotenv>=1.2.2",
  "requests>=2.33.1",
  "streamlit>=1.44.0",
  "uvicorn>=0.44.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
